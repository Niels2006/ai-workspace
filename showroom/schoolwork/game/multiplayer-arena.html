    <!-- supabase-kit.js 已内联，页面可独立运行 -->
    <script>
/*!
 * supabase-kit.js — showroom 统一 Supabase 入口（所有游戏页共用）
 *
 * 提供两件事：
 *   1. Analytics      — 轻量埋点（REST 直连，不依赖 supabase-js）
 *   2. Supa.client()  — 共享 Supabase JS 客户端（Realtime 用；单例，自动按需加载 CDN）
 */
(function (global) {
  'use strict';

  var SUPABASE_URL = 'https://gxdackbnfxbaqcpabcgs.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_7zuwaGboS5j-3Mq6Q0l8vw_VKkJLql2';
  var CDN_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  var REST = SUPABASE_URL + '/rest/v1';
  var FLUSH_MS = 15000;

  // ============================================================
  //  Supa — 共享客户端（Realtime）
  // ============================================================
  var libPromise = null;
  var clientPromise = null;

  function loadLib() {
    if (global.supabase && typeof global.supabase.createClient === 'function') {
      return Promise.resolve();
    }
    if (libPromise) return libPromise;
    libPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = CDN_URL;
      s.onload = function () { resolve(); };
      s.onerror = function () {
        libPromise = null;
        reject(new Error('supabase-js 加载失败'));
      };
      document.head.appendChild(s);
    });
    return libPromise;
  }

  function client() {
    if (!clientPromise) {
      clientPromise = loadLib().then(function () {
        return global.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          realtime: { params: { eventsPerSecond: 10 } }
        });
      }).catch(function (e) {
        clientPromise = null; // 允许重试
        throw e;
      });
    }
    return clientPromise;
  }

  global.Supa = {
    url: SUPABASE_URL,
    key: SUPABASE_KEY,
    client: client
  };

  // ============================================================
  //  Analytics — 轻量埋点（fetch 直连 REST，零依赖）
  // ============================================================
  var LS_PLAYER = 'ga_player_id';
  var LS_NAME = 'player_name';

  var sessionId = null;
  var gameSlug = null;
  var activeMs = 0;
  var lastTick = 0;
  var visible = false;
  var timer = null;
  var started = false;
  var playerKey = null;

  function now() {
    return performance.now();
  }

  function uuid() {
    if (global.crypto && typeof global.crypto.randomUUID === 'function') {
      return global.crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function readLS(key) {
    try { return global.localStorage.getItem(key); } catch (e) { return null; }
  }

  function writeLS(key, val) {
    try { global.localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }

  function request(method, path, body, prefer, keepalive, okStatuses) {
    var headers = {
      apikey: SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    if (prefer) headers['Prefer'] = prefer;
    return fetch(REST + path, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined,
      keepalive: !!keepalive
    }).then(function (res) {
      var ok = res.ok || (okStatuses && okStatuses.indexOf(res.status) >= 0);
      if (!ok) {
        res.text().then(function (t) {
          console.warn('[analytics]', method, path, res.status, t);
        });
      }
      return res.status;
    }).catch(function (e) {
      console.warn('[analytics]', method, path, e);
      return 0;
    });
  }

  function accumulate() {
    if (visible) activeMs += now() - lastTick;
    lastTick = now();
  }

  function patch(ended, keepalive) {
    if (!sessionId) return;
    var body = {
      last_heartbeat: new Date().toISOString(),
      active_seconds: Math.round(activeMs / 1000)
    };
    if (ended) body.ended_at = new Date().toISOString();
    request('PATCH', '/gp_sessions?id=eq.' + sessionId, body, 'return=minimal', keepalive);
    if (ended) sessionId = null;
  }

  function beat() {
    accumulate();
    patch(false, false);
  }

  function startTimer() {
    if (timer || !sessionId) return;
    lastTick = now();
    if (visible) timer = setInterval(beat, FLUSH_MS);
  }

  function stopTimer() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
  }

  function onVisibilityChange() {
    accumulate();
    visible = !document.hidden;
    lastTick = now();
    if (document.hidden) {
      stopTimer();
      patch(false, true);
    } else {
      startTimer();
    }
  }

  function onPageHide() {
    accumulate();
    stopTimer();
    patch(true, true);
  }

  function startSession() {
    if (!playerKey) return Promise.resolve();
    sessionId = uuid();
    activeMs = 0;
    lastTick = now();
    visible = !document.hidden;

    return request('POST', '/gp_sessions', {
      id: sessionId,
      player_id: playerKey,
      game_slug: gameSlug,
      started_at: new Date().toISOString(),
      last_heartbeat: new Date().toISOString(),
      active_seconds: 0,
      locale: global.navigator.language || null,
      ua: (global.navigator.userAgent || '').slice(0, 300),
      screen: global.screen.width + 'x' + global.screen.height,
      referrer: (global.document.referrer || '').slice(0, 300) || null
    }, 'return=minimal').then(function () {
      if (visible) startTimer();
    });
  }

  function init(opts) {
    if (started || !opts || !opts.game) return Promise.resolve();

    started = true;
    gameSlug = String(opts.game);

    playerKey = readLS(LS_PLAYER);
    if (!playerKey) {
      playerKey = uuid();
      writeLS(LS_PLAYER, playerKey);
    }

    var nickname = opts.nickname !== undefined ? opts.nickname : readLS(LS_NAME);
    if (nickname) writeLS(LS_NAME, nickname);

    // 注意：不能用 upsert（on_conflict + merge-duplicates）。
    // ON CONFLICT DO UPDATE 在 RLS 下要求 SELECT 策略可见冲突行，
    // anon 没有 SELECT 权限会直接报 42501。改为「先插，409 再更新」。
    return request('POST', '/gp_players', {
      id: playerKey,
      nickname: nickname || null,
      last_seen: new Date().toISOString()
    }, 'return=minimal', false, [409]).then(function (status) {
      if (status === 409) {
        return request('PATCH', '/gp_players?id=eq.' + playerKey, {
          nickname: nickname || null,
          last_seen: new Date().toISOString()
        }, 'return=minimal');
      }
    }).then(startSession).then(function () {
      document.addEventListener('visibilitychange', onVisibilityChange);
      global.addEventListener('pagehide', onPageHide);
      // 从 bfcache 返回时重新开一段会话
      global.addEventListener('pageshow', function (e) {
        if (e.persisted && !sessionId) startSession();
      });
    });
  }

  function score(value) {
    if (!sessionId) return;
    request('PATCH', '/gp_sessions?id=eq.' + sessionId, {
      score: Number(value) || 0
    }, 'return=minimal');
  }

  function event(name, props) {
    if (!sessionId || !name) return;
    request('POST', '/gp_events', {
      session_id: sessionId,
      game_slug: gameSlug,
      name: String(name),
      props: props || null
    }, 'return=minimal');
  }

  global.Analytics = {
    init: init,
    score: score,
    event: event,
    playerId: function () { return playerKey; }
  };
})(window);
    </script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1220;
            --bg2: #1a1e35;
            --ink: #e5e7eb;
            --muted: #8b92a8;
            --accent: #4f6df5;
            --accent2: #22b8a6;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #f59e0b;
            --font: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: min(96vw, 96dvh * 1.333, 960px);
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #161a2e;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 14px;
            pointer-events: none;
            font-family: var(--mono);
        }

        .hud-box {
            font-size: clamp(11px, 1.8vmin, 14px);
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
        }

        .hud-left {
            color: var(--ink);
        }

        .hud-mid {
            color: var(--accent2);
            text-align: center;
        }

        .hud-right {
            color: var(--accent);
            text-align: right;
        }

        .health-bar {
            width: clamp(80px, 18vmin, 130px);
            height: 8px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .health-fill {
            height: 100%;
            background: var(--green);
            transition: width .15s;
        }

        /* Scoreboard */
        .scoreboard {
            position: absolute;
            right: 10px;
            top: 70px;
            z-index: 20;
            background: rgba(15, 18, 32, .8);
            border: 1px solid rgba(79, 109, 245, .25);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: var(--mono);
            font-size: clamp(10px, 1.6vmin, 12px);
            min-width: 130px;
            pointer-events: none;
            display: none;
        }

        .scoreboard-title {
            color: var(--accent);
            font-size: 10px;
            letter-spacing: .15em;
            margin-bottom: 4px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            color: var(--ink);
        }

        .score-row.me {
            color: var(--accent2);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(600px 300px at 30% 20%, rgba(79, 109, 245, .15), transparent),
                radial-gradient(500px 300px at 70% 80%, rgba(34, 184, 166, .12), transparent),
                rgba(15, 18, 32, .92);
            backdrop-filter: blur(8px);
        }

        .overlay.hidden {
            display: none;
        }

        .join-card {
            background: rgba(26, 30, 53, .9);
            border: 1px solid rgba(79, 109, 245, .25);
            border-radius: 16px;
            padding: clamp(20px, 4vmin, 36px) clamp(24px, 5vmin, 44px);
            width: min(360px, 90vw);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }

        .join-card h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(120deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: .2rem;
        }

        .join-card .subtitle {
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--muted);
            letter-spacing: 3px;
            margin-bottom: 1.4rem;
        }

        .join-card input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: .7rem;
            background: rgba(15, 18, 32, .8);
            border: 1px solid rgba(79, 109, 245, .2);
            border-radius: 10px;
            color: var(--ink);
            font-family: var(--font);
            font-size: .95rem;
            outline: none;
            transition: border .15s;
        }

        .join-card input:focus {
            border-color: var(--accent);
        }

        .join-card input::placeholder {
            color: var(--muted);
        }

        .join-card button {
            width: 100%;
            padding: .75rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 6px 20px rgba(79, 109, 245, .3);
            transition: transform .12s, box-shadow .12s;
        }

        .join-card button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 26px rgba(79, 109, 245, .4);
        }

        .status {
            font-size: .8rem;
            color: var(--muted);
            margin-top: 12px;
            min-height: 20px;
        }

        .status.err {
            color: var(--red);
        }

        .status.ok {
            color: var(--green);
        }

        .hint {
            font-size: .7rem;
            color: var(--muted);
            margin-top: 14px;
            line-height: 1.6;
        }

        /* Toast */
        #toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background: rgba(15, 18, 32, .92);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 15;
            display: none;
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255, 255, 255, .6);
        }

        #crosshair::before {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            top: 50%;
            left: 0;
            height: 2px;
            width: 100%;
            transform: translateY(-50%);
        }

        /* Touch controls */
        #touch-controls {
            position: absolute;
            inset: 0;
            z-index: 18;
            pointer-events: none;
            display: none;
        }

        #touch-controls.active {
            display: block;
        }

        #stick {
            position: absolute;
            left: 20px;
            bottom: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(79, 109, 245, .12);
            border: 2px solid rgba(79, 109, 245, .3);
            pointer-events: auto;
            touch-action: none;
        }

        #knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(79, 109, 245, .4);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #fire-btn {
            position: absolute;
            right: 30px;
            bottom: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .25);
            border: 2px solid rgba(239, 68, 68, .4);
            pointer-events: auto;
            touch-action: none;
        }
    </style>
</head>

<body>

    <script>
        // ============================================================
        //  CONFIG & CONSTANTS
        // ============================================================
        const WORLD_W = 1600;
        const WORLD_H = 1200;
        const VIEW_W = 800;
        const VIEW_H = 600;
        const camera = { x: 0, y: 0 };
        const PLAYER_RADIUS = 16;
        const PLAYER_SPEED = 220;
        const BULLET_SPEED = 520;
        const BULLET_RADIUS = 5;
        const FIRE_COOLDOWN = 0.32;
        const MAX_HEALTH = 100;
        const BULLET_DAMAGE = 18;
        const RESPAWN_TIME = 2.5;
        const SYNC_INTERVAL = 100;
        const HEARTBEAT_TIMEOUT = 3000;
        const INTERP_LERP = 0.2;

        const COLORS = [
            '#ef4444', '#3b82f6', '#22c55e', '#f59e0b',
            '#a855f7', '#06b6d4', '#ec4899', '#84cc16',
            '#f97316', '#6366f1'
        ];

        // 教室地面只参与绘制，不阻挡移动
        const CLASSROOM = {
            frontZoneH: 250,                                    // 讲台区高度
            board: { x: 260, y: 30, w: 1080, h: 100 },          // 黑板
            windows: [                                          // 左侧窗户
                { x: 10, y: 300, w: 20, h: 300 },
                { x: 10, y: 700, w: 20, h: 300 },
            ],
        };

        // 可碰撞教室设施 [x, y, w, h, type]
        const OBSTACLES = [
            [690, 140, 220, 90, 'podium'],
            [1500, 300, 78, 260, 'shelf'],
            [1500, 700, 78, 260, 'shelf'],
            [40, 40, 80, 80, 'plant'],
            [1480, 40, 80, 80, 'plant'],
            [40, 1090, 80, 80, 'plant'],
            [1480, 1090, 80, 80, 'plant'],
        ];
        // 5 列 × 4 排课桌
        const DESK_W = 170, DESK_H = 80;
        for (let row = 0; row < 4; row++) {
            for (let col = 0; col < 5; col++) {
                OBSTACLES.push([130 + col * 280, 400 + row * 180, DESK_W, DESK_H, 'desk']);
            }
        }
        const OBSTACLE_LABELS = {
            podium: '讲台',
            shelf: '书柜',
        };

        // 过道与讲台前方的出生点
        const SPAWNS = [
            [700, 320], [1000, 320], [70, 900], [1460, 900],
            [360, 1130], [700, 1130], [1030, 1130], [1460, 1130],
        ];

        // ============================================================
        //  STATE
        // ============================================================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, DPR = 1, scaleX = 1, scaleY = 1;

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            const rect = canvas.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            // world units -> device pixels (must include DPR, else content only fills 1/DPR of canvas)
            scaleX = (W * DPR) / VIEW_W;
            scaleY = (H * DPR) / VIEW_H;
            updateCamera();
        }
        window.addEventListener('resize', resize);

        const me = {
            id: 'p_' + Math.random().toString(36).slice(2, 10),
            name: 'Player',
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            x: 0, y: 0,
            angle: 0,
            health: MAX_HEALTH,
            score: 0,
            alive: true,
            lastFire: 0,
            respawnAt: 0,
            spawnIdx: 0
        };

        const remotePlayers = new Map();
        const bullets = [];
        const particles = [];

        const keys = {};
        const mouse = { x: WORLD_W / 2, y: WORLD_H / 2, down: false, tracked: false };

        function updateCamera() {
            const previousX = camera.x, previousY = camera.y;
            camera.x = Math.max(0, Math.min(WORLD_W - VIEW_W, me.x - VIEW_W / 2));
            camera.y = Math.max(0, Math.min(WORLD_H - VIEW_H, me.y - VIEW_H / 2));
            // 镜头移动时让已跟踪的指针继续指向同一个屏幕位置
            if (mouse.tracked) {
                mouse.x += camera.x - previousX;
                mouse.y += camera.y - previousY;
            }
        }

        let sbClient = null;
        let channel = null;
        let lastSync = 0;
        let connected = false;
        let gameRunning = false;
        let networkLatency = 0;
        let pingTimer = null;

        // ============================================================
        //  SUPABASE — 配置与客户端由 ../supabase-kit.js 统一提供
        // ============================================================
        function initSupabase() {
            return Supa.client().then(function (c) {
                sbClient = c;
                return true;
            }).catch(function (e) {
                console.error('Supabase init error:', e);
                return false;
            });
        }

        function joinClassroom() {
            const channelName = 'classroom_brawl_v1';

            channel = sbClient.channel(channelName, {
                config: {
                    broadcast: { self: true },
                    presence: { key: me.id }
                }
            });

            // Presence: only for join/leave detection (single track call on join)
            channel.on('presence', { event: 'leave' }, ({ key }) => {
                if (remotePlayers.has(key)) {
                    const rp = remotePlayers.get(key);
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(key);
                    updateScoreboard();
                    updateHUD();
                }
            });

            // Broadcast: player state updates (position, angle, health, score, alive)
            channel.on('broadcast', { event: 'state' }, ({ payload }) => {
                if (payload.id === me.id) return;
                const pid = payload.id;
                if (!remotePlayers.has(pid)) {
                    remotePlayers.set(pid, {
                        id: pid, name: payload.name, color: payload.color,
                        x: payload.x, y: payload.y, angle: payload.angle,
                        targetX: payload.x, targetY: payload.y, targetAngle: payload.angle,
                        health: payload.health, score: payload.score, alive: payload.alive,
                        lastSeen: performance.now()
                    });
                    showToast(`${payload.name} 进入教室`);
                } else {
                    const rp = remotePlayers.get(pid);
                    rp.name = payload.name;
                    rp.color = payload.color;
                    rp.targetX = payload.x;
                    rp.targetY = payload.y;
                    rp.targetAngle = payload.angle;
                    rp.health = payload.health;
                    rp.score = payload.score;
                    rp.alive = payload.alive;
                    rp.lastSeen = performance.now();
                }
            });

            // Broadcast: leave notification
            channel.on('broadcast', { event: 'leave' }, ({ payload }) => {
                if (remotePlayers.has(payload.id)) {
                    const rp = remotePlayers.get(payload.id);
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(payload.id);
                    updateScoreboard();
                    updateHUD();
                }
            });

            channel.on('broadcast', { event: 'shoot' }, ({ payload }) => {
                if (payload.ownerId === me.id) return;
                spawnBullet(payload.x, payload.y, payload.angle, payload.ownerId, payload.ownerColor, false);
            });

            channel.on('broadcast', { event: 'hit' }, ({ payload }) => {
                if (payload.targetId === me.id) {
                    me.health = Math.max(0, me.health - BULLET_DAMAGE);
                    spawnHitParticles(me.x, me.y, '#ff4444');
                    if (me.health <= 0 && me.alive) {
                        die(payload.shooterId, payload.shooterName);
                    }
                }
            });

            channel.on('broadcast', { event: 'kill' }, ({ payload }) => {
                if (payload.victimId === me.id) return; // victim already handled death in die()
                showToast(`${payload.killerName} 击杀了 ${payload.victimName}!`);
                spawnExplosion(payload.x, payload.y, payload.color);
                if (payload.killerId === me.id) {
                    me.score += 1;
                } else if (remotePlayers.has(payload.killerId)) {
                    remotePlayers.get(payload.killerId).score += 1;
                }
                updateScoreboard();
                updateHUD();
            });

            // Broadcast: ping echo for latency measurement
            channel.on('broadcast', { event: 'ping' }, ({ payload }) => {
                if (payload.id !== me.id) return;
                const rtt = performance.now() - payload.ts;
                networkLatency = Math.round(rtt);
                updateConnStatus();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    connected = true;
                    respawn();
                    // Single presence track for join/leave detection only (no state data)
                    try { await channel.track({ name: me.name }); } catch (e) {}
                    startGame();
                    // Start latency pings
                    sendPing();
                    pingTimer = setInterval(sendPing, 3000);
                } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                    connected = false;
                    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
                    networkLatency = 0;
                }
                updateConnStatus();
            });
        }

        function sendPing() {
            if (!channel || !connected) return;
            channel.send({
                type: 'broadcast',
                event: 'ping',
                payload: { id: me.id, ts: performance.now() }
            });
        }

        function updateConnStatus() {
            const el = document.getElementById('conn-status');
            if (connected) {
                const latencyText = networkLatency > 0 ? ` · ${networkLatency}ms` : '';
                el.textContent = `在线 ONLINE${latencyText}`;
                el.style.color = 'var(--green)';
            } else {
                el.textContent = '断开 DISCONNECTED';
                el.style.color = 'var(--red)';
            }
        }

        // Use Broadcast for player state (Presence track has a 5-call limit with sb_publishable_ keys)
        function broadcastState() {
            if (!channel || !connected) return;
            channel.send({
                type: 'broadcast',
                event: 'state',
                payload: {
                    id: me.id,
                    name: me.name,
                    color: me.color,
                    x: Math.round(me.x),
                    y: Math.round(me.y),
                    angle: +me.angle.toFixed(3),
                    health: me.health,
                    score: me.score,
                    alive: me.alive
                }
            });
        }

        function broadcastShoot(x, y, angle) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'shoot',
                payload: { x, y, angle, ownerId: me.id, ownerColor: me.color }
            });
        }

        function broadcastHit(shooterId, targetId, shooterName) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'hit',
                payload: { shooterId, targetId, shooterName }
            });
        }

        function broadcastKill(killerId, victimId, killerName, victimName, x, y, color) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'kill',
                payload: { killerId, victimId, killerName, victimName, x, y, color }
            });
        }

        // ============================================================
        //  COLLISION HELPERS
        // ============================================================
        function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) < (r * r);
        }

        function collidesWithObstacle(x, y, r) {
            for (const o of OBSTACLES) {
                if (circleRectCollide(x, y, r, o[0], o[1], o[2], o[3])) return true;
            }
            return false;
        }

        // ============================================================
        //  GAME LOGIC
        // ============================================================
        function respawn() {
            me.alive = true;
            me.health = MAX_HEALTH;
            const sp = SPAWNS[me.spawnIdx % SPAWNS.length];
            me.spawnIdx++;
            me.x = sp[0];
            me.y = sp[1];
            updateCamera();
        }

        function spawnBullet(x, y, angle, ownerId, ownerColor, isLocal) {
            bullets.push({
                x: x + Math.cos(angle) * (PLAYER_RADIUS + 4),
                y: y + Math.sin(angle) * (PLAYER_RADIUS + 4),
                vx: Math.cos(angle) * BULLET_SPEED,
                vy: Math.sin(angle) * BULLET_SPEED,
                ownerId, ownerColor,
                life: 1.5,
                isLocal
            });
        }

        function fire() {
            const now = performance.now() / 1000;
            if (!me.alive) return;
            if (now - me.lastFire < FIRE_COOLDOWN) return;
            me.lastFire = now;
            spawnBullet(me.x, me.y, me.angle, me.id, me.color, true);
            broadcastShoot(me.x, me.y, me.angle);
        }

        function die(killerId, killerName) {
            me.alive = false;
            me.respawnAt = performance.now() / 1000 + RESPAWN_TIME;
            broadcastKill(killerId, me.id, killerName || 'Someone', me.name, me.x, me.y, me.color);
            spawnExplosion(me.x, me.y, me.color);
            showToast(killerName ? `被 ${killerName} 击杀!` : '你阵亡了!');
        }

        function spawnHitParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 60 + Math.random() * 140;
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 0.4 + Math.random() * 0.3, color, size: 2 + Math.random() * 3
                });
            }
        }

        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 28; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 50 + Math.random() * 260;
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 0.6 + Math.random() * 0.6, color, size: 3 + Math.random() * 5
                });
            }
        }

        function updateLocalPlayer(dt) {
            if (!me.alive) {
                if (performance.now() / 1000 >= me.respawnAt) respawn();
                return;
            }

            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            const len = Math.hypot(dx, dy);
            if (len > 0) { dx /= len; dy /= len; }

            const nx = me.x + dx * PLAYER_SPEED * dt;
            const ny = me.y + dy * PLAYER_SPEED * dt;

            // Move X then Y separately for sliding along walls
            if (!collidesWithObstacle(nx, me.y, PLAYER_RADIUS)) {
                me.x = nx;
            }
            if (!collidesWithObstacle(me.x, ny, PLAYER_RADIUS)) {
                me.y = ny;
            }

            // World bounds
            me.x = Math.max(PLAYER_RADIUS, Math.min(WORLD_W - PLAYER_RADIUS, me.x));
            me.y = Math.max(PLAYER_RADIUS, Math.min(WORLD_H - PLAYER_RADIUS, me.y));
            updateCamera();

            me.angle = Math.atan2(mouse.y - me.y, mouse.x - me.x);

            if (mouse.down) fire();
        }

        function updateRemotePlayers(dt) {
            const now = performance.now();
            for (const [pid, rp] of remotePlayers) {
                // Heartbeat: remove players that stopped broadcasting
                if (now - rp.lastSeen > HEARTBEAT_TIMEOUT) {
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(pid);
                    updateScoreboard();
                    updateHUD();
                    continue;
                }
                if (rp.targetX !== undefined) {
                    rp.x += (rp.targetX - rp.x) * INTERP_LERP;
                    rp.y += (rp.targetY - rp.y) * INTERP_LERP;
                    rp.angle = rp.targetAngle ?? rp.angle;
                }
            }
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                // Out of bounds
                if (b.life <= 0 || b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Bullet hits obstacle
                if (collidesWithObstacle(b.x, b.y, BULLET_RADIUS)) {
                    spawnHitParticles(b.x, b.y, '#888');
                    bullets.splice(i, 1);
                    continue;
                }

                // Local bullet vs remote players
                if (b.isLocal && b.ownerId === me.id) {
                    let hit = false;
                    for (const [pid, rp] of remotePlayers) {
                        if (!rp.alive) continue;
                        const d = Math.hypot(b.x - rp.x, b.y - rp.y);
                        if (d < PLAYER_RADIUS + BULLET_RADIUS) {
                            broadcastHit(me.id, pid, me.name);
                            spawnHitParticles(b.x, b.y, rp.color);
                            hit = true;
                            break;
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                }

                // Remote bullet vs local player
                if (!b.isLocal && me.alive) {
                    const d = Math.hypot(b.x - me.x, b.y - me.y);
                    if (d < PLAYER_RADIUS + BULLET_RADIUS) {
                        const owner = remotePlayers.get(b.ownerId);
                        const ownerName = owner ? owner.name : 'Someone';
                        me.health = Math.max(0, me.health - BULLET_DAMAGE);
                        spawnHitParticles(me.x, me.y, '#ff4444');
                        bullets.splice(i, 1);
                        if (me.health <= 0) die(b.ownerId, ownerName);
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.92;
                p.vy *= 0.92;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ============================================================
        //  RENDERING
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(scaleX, scaleY);
            ctx.translate(-camera.x, -camera.y);

            drawClassroomGround();
            drawObstacles();
            drawBullets();
            drawParticles();

            for (const [pid, rp] of remotePlayers) {
                if (isVisible(rp.x - PLAYER_RADIUS, rp.y - PLAYER_RADIUS, PLAYER_RADIUS * 2, PLAYER_RADIUS * 2)) {
                    drawPlayer(rp, false);
                }
            }
            drawPlayer(me, true);
            drawRespawnTimer();
            ctx.restore();

            // 小地图使用 CSS 像素坐标，不受世界镜头影响
            ctx.save();
            ctx.scale(DPR, DPR);
            drawMinimap();
            ctx.restore();
        }

        function isVisible(x, y, w = 0, h = 0, pad = 60) {
            return x + w >= camera.x - pad && x <= camera.x + VIEW_W + pad &&
                y + h >= camera.y - pad && y <= camera.y + VIEW_H + pad;
        }

        function drawClassroomGround() {
            const left = Math.max(0, camera.x);
            const top = Math.max(0, camera.y);
            const right = Math.min(WORLD_W, camera.x + VIEW_W);
            const bottom = Math.min(WORLD_H, camera.y + VIEW_H);

            // 木地板
            ctx.fillStyle = '#c9a273';
            ctx.fillRect(left, top, right - left, bottom - top);

            // 地板拼缝
            ctx.strokeStyle = 'rgba(120,84,48,0.22)';
            ctx.lineWidth = 1;
            for (let y = Math.floor(top / 64) * 64; y <= bottom; y += 64) {
                ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(120,84,48,0.12)';
            for (let x = Math.floor(left / 96) * 96; x <= right; x += 96) {
                ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
            }

            // 讲台区
            const frontH = CLASSROOM.frontZoneH;
            if (top < frontH) {
                ctx.fillStyle = '#b9925f';
                ctx.fillRect(left, top, right - left, Math.min(bottom, frontH) - top);
                ctx.strokeStyle = 'rgba(90,62,36,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(left, frontH); ctx.lineTo(right, frontH); ctx.stroke();
            }

            // 黑板
            const b = CLASSROOM.board;
            if (isVisible(b.x, b.y, b.w, b.h, 40)) {
                ctx.fillStyle = '#6b4a2c';
                ctx.fillRect(b.x - 10, b.y - 10, b.w + 20, b.h + 20);
                ctx.fillStyle = '#2f4a3c';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = 'rgba(220,235,215,0.28)';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x + 10, b.y + 10, b.w - 20, b.h - 20);

                ctx.fillStyle = 'rgba(240,245,235,0.82)';
                ctx.font = 'bold 44px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('教室大乱斗', b.x + b.w / 2, b.y + b.h / 2 - 6);
                ctx.strokeStyle = 'rgba(240,245,235,0.45)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(b.x + b.w / 2 - 190, b.y + b.h - 22);
                ctx.lineTo(b.x + b.w / 2 + 190, b.y + b.h - 22);
                ctx.stroke();
            }

            // 左侧窗户
            for (const win of CLASSROOM.windows) {
                if (!isVisible(win.x, win.y, win.w, win.h, 40)) continue;
                ctx.fillStyle = '#8fc4d8';
                ctx.fillRect(win.x, win.y, win.w, win.h);
                ctx.strokeStyle = '#e8eef0';
                ctx.lineWidth = 3;
                ctx.strokeRect(win.x + 1.5, win.y + 1.5, win.w - 3, win.h - 3);
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;
                for (let wy = win.y + 50; wy < win.y + win.h; wy += 50) {
                    ctx.beginPath(); ctx.moveTo(win.x, wy); ctx.lineTo(win.x + win.w, wy); ctx.stroke();
                }
            }

            // 墙面
            ctx.strokeStyle = 'rgba(88,60,34,0.55)';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, WORLD_W - 10, WORLD_H - 10);
        }

        function drawObstacles() {
            for (const o of OBSTACLES) {
                const [x, y, w, h, type] = o;
                if (!isVisible(x, y, w, h, 80)) continue;

                if (type === 'desk') {
                    // 桌面阴影与桌体
                    ctx.fillStyle = 'rgba(90,60,32,0.22)';
                    ctx.fillRect(x + 6, y + 8, w, h);
                    ctx.fillStyle = '#dcb98b';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#8a6440';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    // 木纹
                    ctx.strokeStyle = 'rgba(150,108,64,0.35)';
                    ctx.lineWidth = 1;
                    for (let gy = y + 18; gy < y + h - 6; gy += 18) {
                        ctx.beginPath(); ctx.moveTo(x + 8, gy); ctx.lineTo(x + w - 8, gy); ctx.stroke();
                    }
                    // 桌上书本
                    ctx.fillStyle = '#7fa6c9';
                    ctx.fillRect(x + 20, y + 14, 46, 26);
                    ctx.fillStyle = '#c9d8e6';
                    ctx.fillRect(x + 20, y + 14, 46, 5);
                    continue;
                }

                if (type === 'plant') {
                    const cx = x + w / 2, cy = y + h / 2;
                    ctx.fillStyle = 'rgba(90,60,32,0.2)';
                    ctx.beginPath(); ctx.ellipse(cx + 4, cy + 10, 34, 20, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#a8703f';
                    ctx.beginPath(); ctx.arc(cx, cy + 6, 20, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2f7a45';
                    ctx.beginPath(); ctx.arc(cx, cy - 10, 26, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#3f9a55';
                    ctx.beginPath(); ctx.arc(cx - 12, cy - 16, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#57ac66';
                    ctx.beginPath(); ctx.arc(cx + 12, cy - 20, 13, 0, Math.PI * 2); ctx.fill();
                    continue;
                }

                if (type === 'shelf') {
                    ctx.fillStyle = '#7a5433';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#5d3f26';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    const spines = ['#c4674f', '#4f7fbf', '#d8a94a', '#6aa06a', '#9b6bb5'];
                    let idx = 0;
                    for (let sy = y + 12; sy < y + h - 20; sy += 42) {
                        ctx.fillStyle = '#4a3120';
                        ctx.fillRect(x + 8, sy + 30, w - 16, 4);
                        for (let sx = x + 10; sx < x + w - 12; sx += 13) {
                            ctx.fillStyle = spines[idx++ % spines.length];
                            ctx.fillRect(sx, sy, 9, 28);
                        }
                    }
                    continue;
                }

                // 讲台
                ctx.fillStyle = 'rgba(90,60,32,0.24)';
                ctx.fillRect(x + 6, y + 8, w, h);
                ctx.fillStyle = '#9a6a43';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#c69b73';
                ctx.lineWidth = 4;
                ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
                ctx.fillStyle = '#b9895f';
                ctx.fillRect(x + 14, y + 12, w - 28, 26);
                ctx.fillStyle = 'rgba(15,23,32,0.72)';
                ctx.fillRect(x + w / 2 - 52, y + h / 2 - 16, 104, 34);
                ctx.fillStyle = '#f4efe3';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(OBSTACLE_LABELS[type], x + w / 2, y + h / 2 + 1);
            }
        }

        function drawMinimap() {
            const mw = W < 520 ? 112 : 160;
            const s = mw / WORLD_W;
            const mh = WORLD_H * s;
            const mx = 14, my = 86;

            ctx.save();
            ctx.translate(mx, my);
            ctx.fillStyle = 'rgba(10,20,18,0.86)';
            ctx.fillRect(0, 0, mw, mh);
            ctx.fillStyle = '#b9925f';
            ctx.fillRect(0, 0, mw, CLASSROOM.frontZoneH * s);
            ctx.fillStyle = '#2f4a3c';
            const boardRect = CLASSROOM.board;
            ctx.fillRect(boardRect.x * s, boardRect.y * s, boardRect.w * s, boardRect.h * s);
            for (const o of OBSTACLES) {
                ctx.fillStyle = o[4] === 'plant' ? '#4b8b54'
                    : o[4] === 'desk' ? '#dcb98b'
                        : o[4] === 'shelf' ? '#7a5433' : '#c69b73';
                ctx.fillRect(o[0] * s, o[1] * s, Math.max(1.5, o[2] * s), Math.max(1.5, o[3] * s));
            }

            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 1;
            ctx.strokeRect(camera.x * s, camera.y * s, VIEW_W * s, VIEW_H * s);
            for (const [pid, rp] of remotePlayers) {
                if (!rp.alive) continue;
                ctx.fillStyle = rp.color;
                ctx.beginPath(); ctx.arc(rp.x * s, rp.y * s, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = me.color;
            ctx.beginPath(); ctx.arc(me.x * s, me.y * s, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(190,220,200,0.75)';
            ctx.strokeRect(0.5, 0.5, mw - 1, mh - 1);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('教室地图', 0, -5);
            ctx.restore();
        }

        function drawPlayer(p, isMe) {
            ctx.save();
            ctx.globalAlpha = p.alive ? 1 : 0.25;

            // Self highlight
            if (isMe && p.alive) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_RADIUS + 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Body
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Eyes looking at angle
            const ex = Math.cos(p.angle) * 5;
            const ey = Math.sin(p.angle) * 5;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p.x + ex - 4, p.y + ey - 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(p.x + ex + 4, p.y + ey - 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(p.x + ex - 4, p.y + ey - 2, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(p.x + ex + 4, p.y + ey - 2, 1.5, 0, Math.PI * 2); ctx.fill();

            // Name
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(p.name + (isMe ? ' (你)' : ''), p.x, p.y - PLAYER_RADIUS - 4);

            // Health bar
            if (p.alive) {
                const bw = 36, bh = 5;
                const bx = p.x - bw / 2, by = p.y + PLAYER_RADIUS + 4;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(bx, by, bw, bh);
                const pct = Math.max(0, p.health / MAX_HEALTH);
                ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#f59e0b' : '#ef4444';
                ctx.fillRect(bx, by, bw * pct, bh);
            }

            ctx.restore();
        }

        function drawBullets() {
            for (const b of bullets) {
                if (!isVisible(b.x - BULLET_RADIUS, b.y - BULLET_RADIUS, BULLET_RADIUS * 2, BULLET_RADIUS * 2)) continue;
                ctx.save();
                ctx.shadowColor = b.ownerColor;
                ctx.shadowBlur = 8;
                ctx.fillStyle = b.ownerColor;
                ctx.beginPath();
                ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(b.x - 1.5, b.y - 1.5, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawParticles() {
            for (const p of particles) {
                if (!isVisible(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2)) continue;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawRespawnTimer() {
            if (me.alive) return;
            const now = performance.now() / 1000;
            const remain = Math.max(0, me.respawnAt - now);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(camera.x, camera.y, VIEW_W, VIEW_H);
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`RESPAWN ${remain.toFixed(1)}s`, camera.x + VIEW_W / 2, camera.y + VIEW_H / 2);
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================
        let lastTime = 0;

        function loop(ts) {
            if (!gameRunning) { requestAnimationFrame(loop); return; }
            const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
            lastTime = ts;

            updateLocalPlayer(dt);
            updateRemotePlayers(dt);
            updateBullets(dt);
            updateParticles(dt);

            const now = performance.now();
            if (now - lastSync >= SYNC_INTERVAL) {
                broadcastState();
                lastSync = now;
            }

            updateHUD();
            render();
            requestAnimationFrame(loop);
        }

        function updateHUD() {
            document.getElementById('health-fill').style.width = (me.health / MAX_HEALTH * 100) + '%';
            document.getElementById('my-score').textContent = me.score;
            document.getElementById('player-count').textContent = remotePlayers.size + 1;
        }

        function updateScoreboard() {
            const list = document.getElementById('score-list');
            const all = [{ name: me.name, score: me.score, color: me.color, me: true }];
            for (const [pid, rp] of remotePlayers) {
                all.push({ name: rp.name, score: rp.score, color: rp.color, me: false });
            }
            all.sort((a, b) => b.score - a.score);
            list.innerHTML = all.map(p =>
                `<div class="score-row ${p.me ? 'me' : ''}"><span><span class="dot" style="background:${p.color}"></span>${p.name}</span><span>${p.score}</span></div>`
            ).join('');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ============================================================
        //  INPUT
        // ============================================================
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') { e.preventDefault(); mouse.down = true; }
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === ' ') mouse.down = false;
        });

        function screenToWorld(sx, sy) {
            const rect = canvas.getBoundingClientRect();
            const cx = sx - rect.left;
            const cy = sy - rect.top;
            // cx is in CSS pixels; scaleX maps world -> device pixels, so divide by DPR first
            return {
                x: camera.x + (cx * DPR) / scaleX,
                y: camera.y + (cy * DPR) / scaleY
            };
        }

        canvas.addEventListener('mousemove', e => {
            const w = screenToWorld(e.clientX, e.clientY);
            mouse.x = w.x;
            mouse.y = w.y;
            mouse.tracked = true;
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        // Touch
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const crosshair = document.getElementById('crosshair');
        if (isTouch) {
            document.getElementById('touch-controls').classList.add('active');
            const stick = document.getElementById('stick');
            const knob = document.getElementById('knob');
            let stickId = null, stickCX = 0, stickCY = 0;
            stick.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                stickId = t.identifier;
                const rect = stick.getBoundingClientRect();
                stickCX = rect.left + rect.width / 2;
                stickCY = rect.top + rect.height / 2;
            }, { passive: false });
            stick.addEventListener('touchmove', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier !== stickId) continue;
                    let dx = t.clientX - stickCX, dy = t.clientY - stickCY;
                    const max = 35, d = Math.hypot(dx, dy);
                    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
                    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    const nx = dx / max, ny = dy / max;
                    keys['w'] = ny < -0.3; keys['s'] = ny > 0.3;
                    keys['a'] = nx < -0.3; keys['d'] = nx > 0.3;
                }
            }, { passive: false });
            stick.addEventListener('touchend', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === stickId) {
                        stickId = null;
                        knob.style.transform = 'translate(-50%,-50%)';
                        keys['w'] = keys['s'] = keys['a'] = keys['d'] = false;
                    }
                }
            });

            const fireBtn = document.getElementById('fire-btn');
            fireBtn.addEventListener('touchstart', e => { e.preventDefault(); mouse.down = true; }, { passive: false });
            fireBtn.addEventListener('touchend', () => mouse.down = false);

            // Touch aim on canvas
            canvas.addEventListener('touchstart', e => {
                const t = e.changedTouches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                mouse.x = w.x; mouse.y = w.y;
                mouse.tracked = true;
                mouse.down = true;
            }, { passive: false });
            canvas.addEventListener('touchend', () => { mouse.down = false; });
            canvas.addEventListener('touchmove', e => {
                const t = e.changedTouches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                mouse.x = w.x; mouse.y = w.y;
                mouse.tracked = true;
            }, { passive: false });
        } else {
            crosshair.style.display = 'block';
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                crosshair.style.left = (e.clientX - rect.left) + 'px';
                crosshair.style.top = (e.clientY - rect.top) + 'px';
            });
        }

        // ============================================================
        //  UI FLOW
        // ============================================================
        const joinOverlay = document.getElementById('join-overlay');
        const hud = document.getElementById('hud');
        const scoreboard = document.getElementById('scoreboard');

        const savedName = localStorage.getItem('player_name') || 'Player' + Math.floor(Math.random() * 1000);
        document.getElementById('player-name').value = savedName;

        document.getElementById('join-btn').addEventListener('click', () => {
            const name = document.getElementById('player-name').value.trim() || 'Player';
            me.name = name;
            localStorage.setItem('player_name', name);

            const statusEl = document.getElementById('join-status');
            statusEl.textContent = '连接中...';
            statusEl.className = 'status';

            initSupabase().then(function (ok) {
                if (!ok) {
                    statusEl.textContent = '❌ Supabase 连接失败，请稍后重试';
                    statusEl.className = 'status err';
                    return;
                }
                joinClassroom();
            });
        });

        function startGame() {
            joinOverlay.classList.add('hidden');
            hud.style.display = 'flex';
            scoreboard.style.display = 'block';
            resize();
            gameRunning = true;
            lastTime = performance.now();
            lastSync = performance.now(); // 避免加入后立即重复广播
            showToast(`已进入教室`);
        }

        window.addEventListener('beforeunload', () => {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
            if (channel) {
                // Notify others we're leaving before unsubscribing
                channel.send({
                    type: 'broadcast',
                    event: 'leave',
                    payload: { id: me.id }
                });
                channel.unsubscribe();
            }
        });

        resize();
        requestAnimationFrame(loop);
    </script>
